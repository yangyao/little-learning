name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ios/LittleLearning
    steps:
      - uses: actions/checkout@v4
      - name: Core rules and persistence
        run: zsh scripts/check_core.sh
      - name: Store and rewards
        run: zsh scripts/check_store.sh
      - name: QR image roundtrip
        run: zsh scripts/check_sync_images.sh
      - name: Build native Mac preview
        run: swift build

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Ledger, concurrency and persistence
        run: go test -race ./...
      - name: Authenticated HTTP, backup and restart
        run: |
          go build -o learning-server ./cmd/learning-server
          python3 scripts/check_http.py ./learning-server
      - name: ARM64 NAS binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o learning-server-linux-arm64 ./cmd/learning-server

  android-tv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Rule checks
        run: sh scripts/check.sh
      - name: Build and lint without private config or optional games
        run: ./gradlew assembleDebug assembleRelease lintDebug lintRelease
